version: '3'

Services:
  redis:
    image: redis
    ports: 
        - "6379:6379"


  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis 

  api:
    build: .
    command: uvicorn app.main:app --reload --host 0.0.0.0  --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis 
    